<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten System</title>

<style>
body{
    font-family:Arial;
    background:#111;
    color:white;
    margin:20px;
}

h1{text-align:center;}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1400px;
}

th,td{
    border:1px solid #333;
    padding:6px;
    text-align:center;
}

th{background:#222;}

input{
    width:55px;
    background:#1a1a1a;
    color:white;
    border:1px solid #444;
    text-align:center;
}

.subject{
    font-weight:bold;
    min-width:140px;
}

.container{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.avg{
    color:#7CFF7C;
    font-weight:bold;
}

.final{
    color:#4dd0ff;
    font-weight:bold;
}

.readonly input{
    background:#222;
    pointer-events:none;
    opacity:0.8;
}

.topbar{
    margin-bottom:10px;
    color:#aaa;
}
</style>

</head>
<body>

<h1>Notenverwaltung</h1>
<div class="topbar" id="mode"></div>

<table>
<thead>
<tr>
<th>Fach</th>
<th colspan="3">H1</th>
<th>Ø</th>
<th colspan="3">H2</th>
<th>Ø</th>
<th>Ende</th>
</tr>

<tr>
<th></th>
<th>T</th><th>K</th><th>M</th>
<th></th>
<th>T</th><th>K</th><th>M</th>
<th></th>
<th></th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

<script>

const isAdmin = location.search.includes("admin=1");

document.getElementById("mode").innerText =
isAdmin ? "ADMIN MODUS" : "ANZEIGE MODUS";

const subjects = [
{ name:"Deutsch", sport:false },
{ name:"Mathe", sport:false },
{ name:"Englisch", sport:false },
{ name:"Biologie", sport:false },
{ name:"Chemie", sport:false },
{ name:"Physik", sport:false },
{ name:"Geographie", sport:false },
{ name:"Geschichte", sport:false },
{ name:"Gemeinschaftskunde", sport:false },
{ name:"Musik", sport:false },
{ name:"Sport", sport:true }
];

const tbody = document.getElementById("body");

subjects.forEach((s,i)=>{

const tr = document.createElement("tr");

tr.className = isAdmin ? "" : "readonly";

tr.innerHTML = `
<td class="subject">${s.name}</td>

<td><div class="container h1t"></div></td>
<td><div class="container h1k"></div></td>
<td><div class="container h1m"></div></td>
<td class="avg h1avg">-</td>

<td><div class="container h2t"></div></td>
<td><div class="container h2k"></div></td>
<td><div class="container h2m"></div></td>
<td class="avg h2avg">-</td>

<td class="final end">-</td>
`;

tbody.appendChild(tr);

});

</script><script>

const STORAGE_KEY = "noten_system_v2";

function getData(){
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
}

function saveData(data){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function createInput(container, onChange){

    const input = document.createElement("input");
    input.type = "number";
    input.min = 1;
    input.max = 6;
    input.step = 0.25;

    input.addEventListener("input", () => {
        updateDynamic(container, onChange);
        onChange();
    });

    container.appendChild(input);
}

function updateDynamic(container, onChange){

    const inputs = [...container.querySelectorAll("input")];

    const last = inputs[inputs.length - 1];

    // neue Box hinzufügen wenn letzte gefüllt
    if(last && last.value !== ""){
        createInput(container, onChange);
    }

    // leere doppelte entfernen
    for(let i = 0; i < inputs.length - 2; i++){
        if(inputs[i].value === "" && inputs[i+1].value === ""){
            inputs[i+1].remove();
        }
    }
}

// Gewichtung Standard
function getWeights(subject){

    if(subject === "Musik"){
        return {t:0.1, k:0.5, m:0.4};
    }

    if(subject === "Sport"){
        return {t:0.6, k:0.4, m:0};
    }

    return {t:0.6, k:0.2, m:0.2};
}

function avg(container){

    const values = [...container.querySelectorAll("input")]
        .map(i => parseFloat(i.value))
        .filter(v => !isNaN(v));

    if(values.length === 0) return null;

    return values.reduce((a,b)=>a+b,0) / values.length;
}

function calcRow(row){

    const name = row.querySelector(".subject").innerText;
    const w = getWeights(name);

    const h1t = avg(row.querySelector(".h1t"));
    const h1k = avg(row.querySelector(".h1k"));
    const h1m = avg(row.querySelector(".h1m"));

    const h2t = avg(row.querySelector(".h2t"));
    const h2k = avg(row.querySelector(".h2k"));
    const h2m = avg(row.querySelector(".h2m"));

    function half(t,k,m){
        let s = 0;
        let sumW = 0;

        if(t !== null){ s += t * w.t; sumW += w.t; }
        if(k !== null){ s += k * w.k; sumW += w.k; }
        if(m !== null){ s += m * w.m; sumW += w.m; }

        return sumW ? s / sumW : null;
    }

    const h1 = half(h1t,h1k,h1m);
    const h2 = half(h2t,h2k,h2m);

    const h1avg = row.querySelector(".h1avg");
    const h2avg = row.querySelector(".h2avg");
    const end = row.querySelector(".end");

    h1avg.innerText = h1 ? h1.toFixed(2) : "-";
    h2avg.innerText = h2 ? h2.toFixed(2) : "-";

    const final = (h1 && h2) ? (h1 + h2)/2 : (h1 || h2);

    end.innerText = final ? final.toFixed(2) : "-";
}

function updateAll(){
    document.querySelectorAll("tbody tr").forEach(calcRow);
}<script>

function initInputs(){

document.querySelectorAll("tbody tr").forEach(row => {

const subject = row.querySelector(".subject").innerText;

const containers = [
"h1t","h1k","h1m",
"h2t","h2k","h2m"
];

containers.forEach(cls => {

const container = row.querySelector("." + cls);

createInput(container, updateAll);

});

});

}

function load(){

const data = getData();

if(!data.rows) return;

document.querySelectorAll("tbody tr").forEach((row,i) => {

const saved = data.rows[i];
if(!saved) return;

fill(row,"h1t",saved.h1t);
fill(row,"h1k",saved.h1k);
fill(row,"h1m",saved.h1m);

fill(row,"h2t",saved.h2t);
fill(row,"h2k",saved.h2k);
fill(row,"h2m",saved.h2m);

});

}

function fill(row,cls,values){

const container = row.querySelector("." + cls);
container.innerHTML = "";

(values || []).forEach(v => {

const input = document.createElement("input");
input.type = "number";
input.value = v;

input.addEventListener("input", () => {
    updateDynamic(container, saveAll);
    saveAll();
});

container.appendChild(input);

});

if(container.children.length === 0){
createInput(container, saveAll);
}

}

function saveAll(){

const rows = [];

document.querySelectorAll("tbody tr").forEach(row => {

const get = (cls) =>
[...row.querySelectorAll("." + cls + " input")]
.map(i => i.value);

rows.push({
h1t:get("h1t"),
h1k:get("h1k"),
h1m:get("h1m"),
h2t:get("h2t"),
h2k:get("h2k"),
h2m:get("h2m")
});

});

saveData({rows});

}

function lockIfNotAdmin(){

const isAdmin = location.search.includes("admin=1");

if(!isAdmin){

document.querySelectorAll("input").forEach(i => {
i.disabled = true;
});

}

}

window.onload = () => {

initInputs();
load();
updateAll();
lockIfNotAdmin();

};

</script>

</body>
</html>
