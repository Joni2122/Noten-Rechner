<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Noten App</title>

<style>
body { font-family: Arial; background:#0f0f0f; color:white; }
h1 { text-align:center; }
table { width:95%; margin:auto; border-collapse:collapse; }
th,td { border:1px solid #333; padding:6px; text-align:center; }
th { background:#222; }
td[contenteditable="true"] { background:#1e1e1e; }
button { margin:10px; padding:10px; }
.admin { display:none; }
</style>
</head>

<body>

<h1>📊 Noten System</h1>

<button onclick="saveData()" class="admin">💾 Speichern</button>

<table>
<thead>
<tr>
<th>Fach</th>
<th>KA1</th><th>KA2</th><th>KA3</th>
<th>T1</th><th>T2</th>
<th>M</th>
<th>HJ1</th>
<th>KA1</th><th>KA2</th><th>KA3</th>
<th>T1</th><th>T2</th>
<th>M</th>
<th>HJ2</th>
<th>Gesamt</th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

<script>

const scriptURL = "HIER_DEINE_URL_EINFÜGEN";

const faecher = [
"Mathe","Deutsch","Englisch","Französisch",
"Gemeinschaftskunde","Wirtschaft","Kunst","Biologie",
"Geographie","Musik"
];

// Admin
const isAdmin = window.location.search.includes("admin=1");
if(isAdmin){
  document.querySelectorAll(".admin").forEach(b=>b.style.display="inline-block");
}

// Tabelle bauen
const body = document.getElementById("body");

faecher.forEach(f=>{
  const row=document.createElement("tr");

  row.innerHTML = `
    <td>${f}</td>
    ${"<td contenteditable='true'></td>".repeat(15)}
    <td>0</td>
  `;

  body.appendChild(row);
});

// Rechner
function calc(row){
  const c=row.querySelectorAll("td");
  const g=i=>parseFloat(c[i].innerText)||0;

  let s1=(g(1)+g(2)+g(3)+g(4)+g(5))/5;
  let m1=g(6);
  let hj1=(s1+m1)/2;

  let s2=(g(8)+g(9)+g(10)+g(11)+g(12))/5;
  let m2=g(13);
  let hj2=(s2+m2)/2;

  let ges=(hj1+hj2)/2;

  c[7].innerText=hj1.toFixed(2);
  c[14].innerText=hj2.toFixed(2);
  c[15].innerText=ges.toFixed(2);
}

// live
document.addEventListener("input",()=>{
  document.querySelectorAll("tbody tr").forEach(calc);
});

// speichern
async function saveData(){
  let data=[];

  document.querySelectorAll("tbody tr").forEach(r=>{
    let c=r.querySelectorAll("td");

    data.push({
      subject:c[0].innerText,
      values:Array.from({length:15}).map((_,i)=>c[i+1].innerText)
    });
  });

  await fetch(scriptURL,{
    method:"POST",
    body:JSON.stringify(data)
  });

  alert("Gespeichert 🚀");
}

// laden
window.onload=async()=>{
  const res=await fetch(scriptURL);
  const data=await res.json();

  const rows=document.querySelectorAll("tbody tr");

  data.forEach((d,i)=>{
    if(!rows[i]) return;

    const c=rows[i].querySelectorAll("td");

    d.values.forEach((v,j)=>{
      c[j+1].innerText=v||"";
    });

    calc(rows[i]);
  });
};

</script>

</body>
</html>
