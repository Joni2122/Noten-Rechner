<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Noten System</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
  padding:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#1e293b;
}

th,td{
  border:1px solid #334155;
  padding:6px;
  text-align:center;
}

th{
  background:#0ea5e9;
}

input{
  width:60px;
  background:#0f172a;
  color:white;
  border:1px solid #334155;
  text-align:center;
  border-radius:6px;
}
</style>
</head>

<body>

<h1>📚 Noten</h1>

<table>
<thead>
<tr>
  <th>Fach</th>
  <th>HJ</th>
  <th>KA1</th>
  <th>KA2</th>
  <th>KA3</th>
  <th>T1</th>
  <th>T2</th>
  <th>Mündlich</th>
  <th>Ø</th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://qrtnqwfcarwvxfljkqon.supabase.co",
  "sb_publishable_j7O7k3fTxwF5_LzTUjrt4w_dzW1ruuv"
);

const subjects = ["Mathe","Deutsch","Englisch","Französisch","NWT"];

let data = [];

async function load(){
  const { data: res } = await supabase.from("grades").select("*");
  data = res || [];
  render();
}

load();

function get(subject, semester){
  return data.find(d => d.subject === subject && d.semester === semester);
}

// 🧮 Berechnung
function calc(e){

  if(!e) return "-";

  let exams = [e.exam1,e.exam2,e.exam3].filter(v=>v!=null);
  let tests = [e.test1,e.test2].filter(v=>v!=null);

  let examAvg = exams.length ? exams.reduce((a,b)=>a+b)/exams.length : null;
  let testAvg = tests.length ? tests.reduce((a,b)=>a+b)/tests.length : null;

  let sum = 0;
  let w = 0;

  if(examAvg!==null){sum+=examAvg*0.6; w+=0.6;}
  if(testAvg!==null){sum+=testAvg*0.6; w+=0.6;}
  if(e.oral!=null){sum+=e.oral*0.4; w+=0.4;}

  return w ? (sum/w).toFixed(2) : "-";
}

// 💾 SAVE FIX
async function save(subject, semester, field, value){

  let entry = data.find(d => d.subject === subject && d.semester === semester);

  if(!entry){
    entry = {subject, semester};
  }

  entry[field] = value === "" ? null : parseFloat(value);

  const { error } = await supabase.from("grades").upsert(entry, {
    onConflict: 'subject,semester'
  });

  if(error) console.log(error);

  load();
}

// 📊 RENDER
function render(){

  const body = document.getElementById("body");
  body.innerHTML = "";

  subjects.forEach(sub => {

    const h1 = get(sub,1) || {};
    const h2 = get(sub,2) || {};

    body.innerHTML += `
      <tr>
        <td>${sub}</td>

        <td>1</td>

        ${cell(sub,1,"exam1",h1.exam1)}
        ${cell(sub,1,"exam2",h1.exam2)}
        ${cell(sub,1,"exam3",h1.exam3)}
        ${cell(sub,1,"test1",h1.test1)}
        ${cell(sub,1,"test2",h1.test2)}
        ${cell(sub,1,"oral",h1.oral)}

        <td>${calc(h1)}</td>
      </tr>

      <tr>
        <td>${sub}</td>

        <td>2</td>

        ${cell(sub,2,"exam1",h2.exam1)}
        ${cell(sub,2,"exam2",h2.exam2)}
        ${cell(sub,2,"exam3",h2.exam3)}
        ${cell(sub,2,"test1",h2.test1)}
        ${cell(sub,2,"test2",h2.test2)}
        ${cell(sub,2,"oral",h2.oral)}

        <td>${calc(h2)}</td>
      </tr>
    `;
  });
}

function cell(subject, semester, field, value){

  return `
    <td>
      <input value="${value ?? ""}"
        onchange="update('${subject}',${semester},'${field}',this.value)">
    </td>
  `;
}

window.update = async function(s, sem, f, v){
  await save(s, sem, f, v);
};

</script>

</body>
</html>
