<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Noten Rechner</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: auto;
}

h1 {
  text-align: center;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

input, select, button {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

button {
  background: #38bdf8;
  cursor: pointer;
}

button:hover {
  background: #0ea5e9;
}

.subject {
  background: #334155;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

.small {
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">
  <h1>📚 Noten Rechner</h1>

  <div id="adminPanel" class="card" style="display:none;">
    <h3>🔐 Admin Panel</h3>

    <input id="subject" placeholder="Fach">
    <input id="grade" type="number" step="0.1" placeholder="Note">
    
    <select id="type">
      <option value="written">Schriftlich</option>
      <option value="oral">Mündlich</option>
    </select>

    <button onclick="addGrade()">Hinzufügen</button>

    <p class="small">Admin Modus aktiv</p>
  </div>

  <div id="list"></div>
</div>

<script>
// -------------------------
// ADMIN CHECK (?admin=1)
// -------------------------
const urlParams = new URLSearchParams(window.location.search);
const isAdmin = urlParams.get("admin") === "1";

if (isAdmin) {
  document.getElementById("adminPanel").style.display = "block";
}

// -------------------------
// DATEN
// -------------------------
const subjects = {};

// 50/50 Fächer
const equalSubjects = ["Geo", "Bio", "Reli", "Gemeinschaftskunde", "Musik"];

// -------------------------
// GEWICHTUNG
// -------------------------
function getWeight(subject, type) {
  const isEqual = equalSubjects.includes(subject);
  if (isEqual) return 0.5;

  return type === "written" ? 0.6 : 0.4;
}

// -------------------------
// NOTE HINZUFÜGEN (ADMIN)
// -------------------------
function addGrade() {
  if (!isAdmin) return;

  const subject = document.getElementById("subject").value.trim();
  const grade = parseFloat(document.getElementById("grade").value);
  const type = document.getElementById("type").value;

  if (!subject || isNaN(grade)) return;

  if (!subjects[subject]) {
    subjects[subject] = [];
  }

  subjects[subject].push({ grade, type });

  render();
}

// -------------------------
// DURCHSCHNITT
// -------------------------
function calcAverage(grades, subject) {
  let sum = 0;
  let weightSum = 0;

  grades.forEach(g => {
    const w = getWeight(subject, g.type);
    sum += g.grade * w;
    weightSum += w;
  });

  return weightSum === 0 ? "-" : (sum / weightSum).toFixed(2);
}

// -------------------------
// RENDER
// -------------------------
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  Object.keys(subjects).forEach(sub => {
    const avg = calcAverage(subjects[sub], sub);

    const div = document.createElement("div");
    div.className = "subject";

    div.innerHTML = `
      <b>${sub}</b><br>
      Durchschnitt: <b>${avg}</b><br>
      ${subjects[sub].map((g, i) => `
        ${g.grade} (${g.type})
        ${isAdmin ? `<button onclick="deleteGrade('${sub}',${i})">❌</button>` : ""}
      `).join("<br>")}
    `;

    list.appendChild(div);
  });
}

// -------------------------
// LÖSCHEN (ADMIN)
// -------------------------
function deleteGrade(subject, index) {
  if (!isAdmin) return;

  subjects[subject].splice(index, 1);
  render();
}

// Start
render();
</script>

</body>
</html>
