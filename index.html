<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten Rechner</title>

<!-- FIREBASE IMPORT -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    margin:20px;
}

h1{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #333;
    padding:10px;
    text-align:center;
}

input{
    width:60px;
    font-size:16px;
}
</style>
</head>

<body>

<h1>📊 Noten Rechner</h1>

<table>
<thead>
<tr>
<th>Fach</th>
<th>Note</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<script>

////////////////////////////////////////////////////
// 🔥 HIER KOMMT DEINE FIREBASE CONFIG REIN
// (DEN BLOCK AUS FIREBASE EINFÜGEN)
////////////////////////////////////////////////////

const firebaseConfig = {
  // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAdC2nb71oeF9XtasVpUnmJot0ZqaODSaQ",
  authDomain: "noten-fc7d8.firebaseapp.com",
  databaseURL: "https://noten-fc7d8-default-rtdb.firebaseio.com",
  projectId: "noten-fc7d8",
  storageBucket: "noten-fc7d8.firebasestorage.app",
  messagingSenderId: "429440294646",
  appId: "1:429440294646:web:1db4b5690f10ea722b56d7",
  measurementId: "G-DDL10H1QWY"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

////////////////////////////////////////////////////

const faecher = [
"Mathe",
"Deutsch",
"Englisch",
"Bio",
"Geo",
"Musik",
"Religion",
"Sport"
];

const tableBody = document.getElementById("tableBody");

// Tabelle erstellen
faecher.forEach((fach, i) => {

const row = document.createElement("tr");

row.innerHTML = `
<td>${fach}</td>
<td><input type="number" min="1" max="6" id="note${i}"></td>
`;

tableBody.appendChild(row);

});

// speichern
function speichern(){

let daten = {};

faecher.forEach((fach, i) => {
daten[fach] = document.getElementById("note"+i).value;
});

db.collection("noten").doc("user1").set(daten);

}

// laden
async function laden(){

const doc = await db.collection("noten").doc("user1").get();

if(doc.exists){
const daten = doc.data();

faecher.forEach((fach, i) => {
if(daten[fach]){
document.getElementById("note"+i).value = daten[fach];
}
});

}

}

// automatisch speichern
document.addEventListener("input", speichern);

laden();

</script>

</body>
</html>
