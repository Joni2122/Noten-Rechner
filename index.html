<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Chatbot</title>
<style>
  body { font-family: Arial; background:#111; color:white; text-align:center; }
  #chat { width:90%; max-width:600px; margin:20px auto; }
  #log { height:400px; overflow:auto; border:1px solid #444; padding:10px; }
  input { width:80%; padding:10px; }
  button { padding:10px; }
</style>
</head>
<body>

<h2>💬 Mein Chatbot</h2>

<div id="chat">
  <div id="log"></div>
  <input id="msg" placeholder="Schreib etwas...">
  <button onclick="send()">Senden</button>
</div>

<script>
async function send() {
  const input = document.getElementById("msg");
  const log = document.getElementById("log");

  const text = input.value;
  log.innerHTML += "<div><b>Du:</b> " + text + "</div>";

  input.value = "";

  const res = await fetch("https://DEIN-BACKEND-URL/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  log.innerHTML += "<div><b>Bot:</b> " + data.reply + "</div>";
  log.scrollTop = log.scrollHeight;
}
</script>

</body>
</html>
