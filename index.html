<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Noten System</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  margin:0;
  padding:20px;
}

table{
  width:100%;
  border-collapse: collapse;
  margin-top:20px;
  background:#1e293b;
}

th,td{
  border:1px solid #334155;
  padding:10px;
  text-align:center;
}

th{
  background:#0ea5e9;
}

input,select,button{
  padding:6px;
  margin:4px;
  border-radius:6px;
  border:none;
}

button{
  background:#38bdf8;
  cursor:pointer;
}
button:hover{background:#0ea5e9;}
</style>
</head>

<body>

<h1>📚 Noten Tabelle</h1>

<button onclick="save()">Speichern</button>

<table>
<thead>
<tr>
  <th>Fach</th>
  <th>HJ1 Ø</th>
  <th>HJ2 Ø</th>
  <th>Gesamt</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://qrtnqwfcarwvxfljkqon.supabase.co",
  "sb_publishable_j7O7k3fTxwF5_LzTUjrt4w_dzW1ruuv"
);

// 📚 feste Fächer
const subjects = ["Mathe","Deutsch","Englisch","Französisch","NWT","Geo","Bio","Reli","Musik","GK"];

let data = {};

// 📥 LOAD
async function load(){
  const { data: result } = await supabase.from("grades").select("*");
  data = result || [];
  render();
}

load();

// 📊 WERT PRO FACH
function calc(entry){

  let exam = [entry.exam1, entry.exam2, entry.exam3].filter(x => x != null);
  let test = [entry.test1, entry.test2].filter(x => x != null);

  let oral = entry.oral;

  let examAvg = exam.length ? exam.reduce((a,b)=>a+b)/exam.length : null;
  let testAvg = test.length ? test.reduce((a,b)=>a+b)/test.length : null;

  if(!examAvg && !testAvg && !oral) return "-";

  let sum = 0;
  let w = 0;

  if(examAvg !== null){
    sum += examAvg * 0.6;
    w += 0.6;
  }

  if(testAvg !== null){
    sum += testAvg * 0.6;
    w += 0.6;
  }

  if(oral !== null){
    sum += oral * 0.4;
    w += 0.4;
  }

  return (sum / w).toFixed(2);
}

// 📊 RENDER
function render(){

  const body = document.getElementById("body");
  body.innerHTML = "";

  subjects.forEach(sub => {

    const h1 = data.find(d => d.subject === sub && d.semester === 1) || {};
    const h2 = data.find(d => d.subject === sub && d.semester === 2) || {};

    body.innerHTML += `
      <tr>
        <td>${sub}</td>
        <td>${calc(h1)}</td>
        <td>${calc(h2)}</td>
        <td><b>${avg(calc(h1),calc(h2))}</b></td>
      </tr>
    `;
  });
}

// 📊 Gesamt
function avg(a,b){
  let arr = [parseFloat(a), parseFloat(b)].filter(x=>!isNaN(x));
  if(!arr.length) return "-";
  return (arr.reduce((x,y)=>x+y)/arr.length).toFixed(2);
}

// 💾 SPEICHERN (TEST FIX)
window.save = async function(){

  for(let sub of subjects){

    await supabase.from("grades").upsert({
      subject: sub,
      semester: 1,
      exam1: 1,
      exam2: null,
      exam3: null,
      test1: 2,
      test2: 3,
      oral: 2
    });

  }

  load();
};

</script>

</body>
</html>
