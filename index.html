<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten Rechner</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    margin:10px;
}

h1{
    text-align:center;
}

.table-wrap{
    overflow-x:auto;
}

table{
    border-collapse:collapse;
    min-width:1500px;
    width:100%;
}

th,td{
    border:1px solid #333;
    padding:6px;
    text-align:center;
    font-size:14px;
}

th{
    background:#222;
}

input{
    width:48px;
    background:#1a1a1a;
    color:white;
    border:1px solid #444;
    text-align:center;
}

.subject{
    font-weight:bold;
    min-width:150px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    justify-content:center;
}

.avg{
    color:#7CFF7C;
    font-weight:bold;
}

.end{
    color:#4dd0ff;
    font-weight:bold;
}

.locked input{
    pointer-events:none;
    opacity:0.6;
}

@media(max-width:700px){
    input{width:42px;}
}
</style>
</head>

<body>

<h1>Notenverwaltung</h1>
<div id="mode"></div>

<div class="table-wrap">
<table>

<thead>
<tr>
<th>Fach</th>

<th colspan="6">Halbjahr 1</th>
<th>Ø</th>

<th colspan="6">Halbjahr 2</th>
<th>Ø</th>

<th>Ende</th>
</tr>

<tr>
<th></th>
<th>T1</th><th>T2</th>
<th>K1</th><th>K2</th><th>K3</th>
<th>M</th>
<th></th>

<th>T1</th><th>T2</th>
<th>K1</th><th>K2</th><th>K3</th>
<th>M</th>
<th></th>
<th></th>
</tr>
</thead>

<tbody id="body"></tbody>

</table>
</div>

<script>

const isAdmin = location.search.includes("admin=1");

document.getElementById("mode").innerText =
isAdmin ? "ADMIN MODUS" : "VIEW MODUS";

const subjects = [
"Deutsch","Mathe","Englisch","Physik","Chemie",
"Biologie","Geo","Geschichte","GK","Religion","Musik","Sport"
];

function weights(name){

const halfHalf = [
"Geo","Biologie","Gemeinschaftskunde","Religion","Musik","GK"
];

if(name === "Sport"){
return {s:1,m:0};
}

if(halfHalf.includes(name)){
return {s:0.5,m:0.5};
}

return {s:0.6,m:0.4};

}

function avg(container){

const v = [...container.querySelectorAll("input")]
.map(i=>parseFloat(i.value))
.filter(x=>!isNaN(x));

if(!v.length) return null;

return v.reduce((a,b)=>a+b)/v.length;
}

function calcHalf(row,prefix,w){

const t = avg(row.querySelector("."+prefix+"t"));
const k = avg(row.querySelector("."+prefix+"k"));
const m = avg(row.querySelector("."+prefix+"m"));

let schrift = [];
let gew = [];

// 4 Tests = 1 Klassenarbeit
if(t!==null){schrift.push(t);gew.push(0.25);}
if(k!==null){schrift.push(k);gew.push(1);}

let schriftAvg = null;

if(schrift.length){
schriftAvg =
schrift.reduce((a,b,i)=>a+b*gew[i],0)
/ gew.reduce((a,b)=>a+b,0);
}

let res = 0;

if(schriftAvg!==null){
res += schriftAvg * w.s;
}

if(m!==null){
res += m * w.m;
}

return res || null;
}

const body = document.getElementById("body");

subjects.forEach(name=>{

const tr = document.createElement("tr");

if(!isAdmin) tr.classList.add("locked");

tr.innerHTML = `
<td class="subject">${name}</td>

<td><div class="container h1t"></div></td>
<td><div class="container h1t"></div></td>

<td><div class="container h1k"></div></td>
<td><div class="container h1k"></div></td>
<td><div class="container h1k"></div></td>

<td><div class="container h1m"></div></td>
<td class="avg h1a">-</td>

<td><div class="container h2t"></div></td>
<td><div class="container h2t"></div></td>

<td><div class="container h2k"></div></td>
<td><div class="container h2k"></div></td>
<td><div class="container h2k"></div></td>

<td><div class="container h2m"></div></td>
<td class="avg h2a">-</td>

<td class="end">-</td>
`;

body.appendChild(tr);

});

function addInput(c){
const i=document.createElement("input");
i.type="number";
i.min=1;
i.max=6;
i.step=0.25;
i.addEventListener("input",updateAll);
c.appendChild(i);
}

document.querySelectorAll(".container").forEach(c=>{
addInput(c);
});

function updateAll(){

document.querySelectorAll("tbody tr").forEach(row=>{

const name=row.querySelector(".subject").innerText;
const w=weights(name);

const h1=calcHalf(row,"h1",w);
const h2=calcHalf(row,"h2",w);

row.querySelector(".h1a").innerText=h1?h1.toFixed(2):"-";
row.querySelector(".h2a").innerText=h2?h2.toFixed(2):"-";

let end=null;

if(h1&&h2) end=(h1+h2)/2;
else end=h1||h2;

row.querySelector(".end").innerText=end?end.toFixed(2):"-";

});

}

updateAll();

</script>

</body>
</html>
