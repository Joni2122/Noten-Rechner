<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Noten System</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:rgba(30,41,59,0.85);
  backdrop-filter: blur(10px);
  border-radius:12px;
  overflow:hidden;
}

th,td{
  border:1px solid #334155;
  padding:8px;
  text-align:center;
}

th{
  background:#0ea5e9;
}

input{
  width:60px;
  background:#1e293b;
  color:white;
  border:1px solid #334155;
  border-radius:6px;
  text-align:center;
}

.subject{
  font-weight:bold;
}

.avg{
  font-weight:bold;
  color:#38bdf8;
}
</style>
</head>

<body>

<h1>📚 Noten System</h1>

<table>
<thead>
<tr>
  <th>Fach</th>
  <th>KA1</th>
  <th>KA2</th>
  <th>KA3</th>
  <th>Test1</th>
  <th>Test2</th>
  <th>Mündlich</th>
  <th>HJ1</th>
  <th>HJ2</th>
  <th>Gesamt</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://qrtnqwfcarwvxfljkqon.supabase.co",
  "sb_publishable_j7O7k3fTxwF5_LzTUjrt4w_dzW1ruuv"
);

// 📚 feste Fächer
const subjects = [
  "Mathe","Deutsch","Englisch","Französisch","NWT",
  "Geo","Bio","Chemie","Physik","Geschichte",
  "Gemeinschaftskunde","Musik","Kunst","Reli","Sport"
];

let data = [];

// 📥 LOAD
async function load(){
  const { data: res } = await supabase.from("grades").select("*");
  data = res || [];
  render();
}

load();

// 🔍 Daten holen pro Fach + Halbjahr
function get(sub, sem){
  return data.find(d => d.subject === sub && d.semester === sem) || {};
}

// 🧮 Berechnung
function calc(entry){

  let exams = [entry.exam1, entry.exam2, entry.exam3].filter(v => v != null);
  let tests = [entry.test1, entry.test2].filter(v => v != null);
  let oral = entry.oral;

  let examAvg = exams.length ? exams.reduce((a,b)=>a+b)/exams.length : null;
  let testAvg = tests.length ? tests.reduce((a,b)=>a+b)/tests.length : null;

  let sum = 0;
  let weight = 0;

  if(examAvg !== null){
    sum += examAvg * 0.6;
    weight += 0.6;
  }

  if(testAvg !== null){
    sum += testAvg * 0.6;
    weight += 0.6;
  }

  if(oral !== null){
    sum += oral * 0.4;
    weight += 0.4;
  }

  return weight ? (sum / weight).toFixed(2) : "-";
}

// 💾 UPDATE in DB
async function save(subject, semester, field, value){

  let entry = get(subject, semester);

  entry.subject = subject;
  entry.semester = semester;
  entry[field] = value === "" ? null : parseFloat(value);

  await supabase.from("grades").upsert(entry);
}

// 📊 RENDER TABLE
function render(){

  const body = document.getElementById("body");
  body.innerHTML = "";

  subjects.forEach(sub => {

    const h1 = get(sub,1);
    const h2 = get(sub,2);

    const row = document.createElement("tr");

    row.innerHTML = `
      <td class="subject">${sub}</td>

      ${cell(sub,1,"exam1",h1.exam1)}
      ${cell(sub,1,"exam2",h1.exam2)}
      ${cell(sub,1,"exam3",h1.exam3)}
      ${cell(sub,1,"test1",h1.test1)}
      ${cell(sub,1,"test2",h1.test2)}
      ${cell(sub,1,"oral",h1.oral)}

      <td class="avg">${calc(h1)}</td>

      ${cell(sub,2,"exam1",h2.exam1)}
      ${cell(sub,2,"exam2",h2.exam2)}
      ${cell(sub,2,"exam3",h2.exam3)}
      ${cell(sub,2,"test1",h2.test1)}
      ${cell(sub,2,"test2",h2.test2)}
      ${cell(sub,2,"oral",h2.oral)}

      <td class="avg">${calc(h2)}</td>

      <td class="avg">
        ${avg(calc(h1), calc(h2))}
      </td>
    `;

    body.appendChild(row);
  });
}

// 🧩 Input Zelle
function cell(subject, semester, field, value){

  return `
    <td>
      <input
        value="${value ?? ""}"
        onchange="update('${subject}',${semester},'${field}',this.value)"
      >
    </td>
  `;
}

// 📊 Gesamt
function avg(a,b){
  let arr = [parseFloat(a), parseFloat(b)].filter(x=>!isNaN(x));
  if(!arr.length) return "-";
  return (arr.reduce((x,y)=>x+y)/arr.length).toFixed(2);
}

// 🌐 global update
window.update = async function(subject, semester, field, value){
  await save(subject, semester, field, value);
  load();
};

</script>

</body>
</html>
