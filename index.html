<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten App</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0b1220;
    color:white;
}

/* TOP BAR */
.header{
    background:#111827;
    padding:15px;
    font-size:20px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* ADMIN BADGE */
.admin{
    color:#34d399;
    font-size:14px;
}

/* CONTAINER */
.container{
    padding:15px;
    max-width:1100px;
    margin:auto;
}

/* CARD */
.card{
    background:#111827;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

.title{
    font-size:18px;
    margin-bottom:10px;
    color:#60a5fa;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #374151;
    padding:6px;
    text-align:center;
}

input{
    width:55px;
    background:#0f172a;
    color:white;
    border:1px solid #334155;
    text-align:center;
    border-radius:5px;
}

.avg{
    color:#34d399;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
📊 Noten App
<div id="adminBadge"></div>
</div>

<div class="container" id="app"></div>

<script>

////////////////////////////////////////////////////
// 🔥 FIREBASE CONFIG
////////////////////////////////////////////////////
const firebaseConfig = {
  apiKey: "AIzaSyAdC2nb71oeF9XtasVpUnmJot0ZqaODSaQ",
  authDomain: "noten-fc7d8.firebaseapp.com",
  databaseURL: "https://noten-fc7d8-default-rtdb.firebaseio.com",
  projectId: "noten-fc7d8",
  storageBucket: "noten-fc7d8.firebasestorage.app",
  messagingSenderId: "429440294646",
  appId: "1:429440294646:web:1db4b5690f10ea722b56d7",
  measurementId: "G-DDL10H1QWY"

};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

////////////////////////////////////////////////////

// ADMIN MODUS
const isAdmin = window.location.href.includes("admin=1");

if(isAdmin){
document.getElementById("adminBadge").innerText = "ADMIN MODE";
}

const app = document.getElementById("app");

// Fächer
const subjects = [
"Mathe","Deutsch","Englisch","Bio","Geo","Musik","Religion","Sport"
];

// UI bauen
subjects.forEach((s,i)=>{

const card = document.createElement("div");
card.className="card";

card.innerHTML = `
<div class="title">${s}</div>

<table>
<tr>
<th>T1</th><th>T2</th><th>T3</th>
<th>KA1</th><th>KA2</th>
<th>M</th>
<th>Ø</th>
</tr>

<tr>
<td><input id="t1_${i}"></td>
<td><input id="t2_${i}"></td>
<td><input id="t3_${i}"></td>
<td><input id="k1_${i}"></td>
<td><input id="k2_${i}"></td>
<td><input id="m_${i}"></td>
<td class="avg" id="avg_${i}">-</td>
</tr>
</table>
`;

app.appendChild(card);

});

// Berechnung (stabiler FIX)
function calc(i){

let t1=+document.getElementById("t1_"+i).value||0;
let t2=+document.getElementById("t2_"+i).value||0;
let t3=+document.getElementById("t3_"+i).value||0;

let k1=+document.getElementById("k1_"+i).value||0;
let k2=+document.getElementById("k2_"+i).value||0;

let m=+document.getElementById("m_"+i).value||0;

// Tests
let testAvg=(t1+t2+t3)/3;

// KA
let kaAvg=(k1+k2)/2;

// Gewichtung (stabilisiert)
let result=(testAvg/4 + kaAvg + m)/3;

document.getElementById("avg_"+i).innerText=result.toFixed(2);

return result;
}

// SPEICHERN
function save(){

let data={};

subjects.forEach((s,i)=>{
data[s]={
t1:document.getElementById("t1_"+i).value,
t2:document.getElementById("t2_"+i).value,
t3:document.getElementById("t3_"+i).value,
k1:document.getElementById("k1_"+i).value,
k2:document.getElementById("k2_"+i).value,
m:document.getElementById("m_"+i).value
};
});

db.collection("noten").doc("user").set(data);
}

// LADEN (FIX + stabil)
async function load(){

const doc=await db.collection("noten").doc("user").get();

if(doc.exists){
let data=doc.data();

subjects.forEach((s,i)=>{

if(data[s]){
document.getElementById("t1_"+i).value=data[s].t1||"";
document.getElementById("t2_"+i).value=data[s].t2||"";
document.getElementById("t3_"+i).value=data[s].t3||"";
document.getElementById("k1_"+i).value=data[s].k1||"";
document.getElementById("k2_"+i).value=data[s].k2||"";
document.getElementById("m_"+i).value=data[s].m||"";

calc(i);
}

});

}
}

// LIVE UPDATE FIX
document.addEventListener("input",()=>{

subjects.forEach((_,i)=>calc(i));
save();

});

load();

</script>

</body>
</html>
