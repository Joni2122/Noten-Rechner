<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>

/* 🌈 NEUES MODERNES DESIGN */
body{
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle at top,#1e293b,#0b1020);
    color:white;
}

/* HEADER */
.header{
    padding:18px;
    font-size:22px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    background:#0f172a;
    border-bottom:1px solid #1f2937;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    padding:15px;
}

/* CARD */
.card{
    background:#111827;
    border-radius:16px;
    padding:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.title{
    font-size:18px;
    margin-bottom:10px;
    color:#60a5fa;
}

/* INPUT GRID */
.row{
    display:grid;
    grid-template-columns: repeat(6,1fr);
    gap:5px;
}

/* INPUTS */
input{
    width:100%;
    padding:6px;
    border-radius:8px;
    border:none;
    text-align:center;
    background:#0f172a;
    color:white;
    font-size:14px;
}

/* AVG */
.avg{
    margin-top:8px;
    font-weight:bold;
    color:#34d399;
}

/* BUTTON */
button{
    margin:10px;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

</style>
</head>

<body>

<div class="header">
📊 Noten System
<div id="mode"></div>
</div>

<div id="app" class="grid"></div>

<div style="text-align:center;">
<button id="saveBtn" style="display:none;">💾 Speichern</button>
</div>

<script>

////////////////////////////////////////////////////
// FIREBASE
////////////////////////////////////////////////////
const firebaseConfig = {
  apiKey: "AIzaSyAdC2nb71oeF9XtasVpUnmJot0ZqaODSaQ",
  authDomain: "noten-fc7d8.firebaseapp.com",
  databaseURL: "https://noten-fc7d8-default-rtdb.firebaseio.com",
  projectId: "noten-fc7d8",
  storageBucket: "noten-fc7d8.firebasestorage.app",
  messagingSenderId: "429440294646",
  appId: "1:429440294646:web:1db4b5690f10ea722b56d7",
  measurementId: "G-DDL10H1QWY"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

////////////////////////////////////////////////////

// ADMIN CHECK
const isAdmin = new URLSearchParams(location.search).has("admin");

document.getElementById("mode").innerText =
isAdmin ? "ADMIN MODE" : "VIEW MODE";

if(isAdmin){
document.getElementById("saveBtn").style.display="inline-block";
}

const subjects = [
"Mathe","Deutsch","Englisch","Bio","Geo","Musik","Religion","Sport"
];

const app = document.getElementById("app");

// DATA CACHE
let cache = {};

// UI
subjects.forEach((s,i)=>{

const card = document.createElement("div");
card.className="card";

card.innerHTML = `
<div class="title">${s}</div>

<div class="row">
<input id="t1_${i}" placeholder="T1">
<input id="t2_${i}" placeholder="T2">
<input id="t3_${i}" placeholder="T3">
<input id="k1_${i}" placeholder="KA1">
<input id="k2_${i}" placeholder="KA2">
<input id="m_${i}" placeholder="M">
</div>

<div class="avg" id="avg_${i}">Ø: -</div>
`;

app.appendChild(card);

});

// 🧮 NEUE BERECHNUNG (STABIL)
function calc(i){

let t1=+val("t1_"+i);
let t2=+val("t2_"+i);
let t3=+val("t3_"+i);

let k1=+val("k1_"+i);
let k2=+val("k2_"+i);

let m=+val("m_"+i);

// Tests → 4 = 1 KA
let testAvg=(t1+t2+t3)/3;
let testWeight=testAvg/4;

let kaAvg=(k1+k2)/2;

// Gesamt
let result=(testWeight+kaAvg+m)/3;

document.getElementById("avg_"+i).innerText="Ø: "+result.toFixed(2);

cache[i]=result;
}

function val(id){
return document.getElementById(id).value||0;
}

// 💾 SAVE BUTTON (NUR ADMIN)
document.getElementById("saveBtn").onclick=async()=>{

let data={};

subjects.forEach((s,i)=>{

data[s]={
t1:val("t1_"+i),
t2:val("t2_"+i),
t3:val("t3_"+i),
k1:val("k1_"+i),
k2:val("k2_"+i),
m:val("m_"+i)
};

});

await db.collection("noten").doc("user").set(data);

alert("Gespeichert ✔");
};

// 📥 LOAD
async function load(){

const doc=await db.collection("noten").doc("user").get();

if(!doc.exists)return;

let data=doc.data();

subjects.forEach((s,i)=>{

if(!data[s])return;

document.getElementById("t1_"+i).value=data[s].t1;
document.getElementById("t2_"+i).value=data[s].t2;
document.getElementById("t3_"+i).value=data[s].t3;
document.getElementById("k1_"+i).value=data[s].k1;
document.getElementById("k2_"+i).value=data[s].k2;
document.getElementById("m_"+i).value=data[s].m;

calc(i);

});

}

// 🔥 LIVE UPDATE FIX
document.addEventListener("input",()=>{

subjects.forEach((_,i)=>calc(i));

if(isAdmin){
document.getElementById("saveBtn").disabled=false;
}

});

// INIT
load();

</script>

</body>
</html>
