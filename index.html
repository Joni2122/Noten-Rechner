<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten Rechner</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    margin:20px;
}

h1{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1400px;
}

th,td{
    border:1px solid #333;
    padding:6px;
    text-align:center;
}

th{
    background:#222;
}

input{
    width:55px;
    background:#1a1a1a;
    color:white;
    border:1px solid #444;
    text-align:center;
}

.subject{
    font-weight:bold;
    min-width:140px;
}

.container{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.avg{
    color:#7CFF7C;
    font-weight:bold;
}

.end{
    color:#4dd0ff;
    font-weight:bold;
}

.locked input{
    pointer-events:none;
    opacity:0.6;
}
</style>
</head>

<body>

<h1>Notenverwaltung</h1>
<div id="mode"></div>

<table>
<thead>
<tr>
<th>Fach</th>
<th colspan="3">Halbjahr 1</th>
<th>Ø</th>
<th colspan="3">Halbjahr 2</th>
<th>Ø</th>
<th>Endnote</th>
</tr>

<tr>
<th></th>
<th>T</th><th>K</th><th>M</th>
<th></th>
<th>T</th><th>K</th><th>M</th>
<th></th>
<th></th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

<script>

const isAdmin = location.search.includes("admin=1");

document.getElementById("mode").innerText =
isAdmin ? "ADMIN MODUS" : "VIEW MODUS";

const subjects = [
"Deutsch","Mathe","Englisch","Biologie","Chemie",
"Physik","Geo","Geschichte","GK","Musik","Sport"
];

// Gewichtungen
function weights(name){

if(name === "Musik"){
return {t:0.1,k:0.5,m:0.4};
}

if(name === "Sport"){
return {t:0.6,k:0.4,m:0};
}

return {t:0.6,k:0.2,m:0.2};
}

const body = document.getElementById("body");

subjects.forEach(name => {

const tr = document.createElement("tr");

if(!isAdmin) tr.classList.add("locked");

tr.innerHTML = `
<td class="subject">${name}</td>

<td><div class="container h1t"></div></td>
<td><div class="container h1k"></div></td>
<td><div class="container h1m"></div></td>
<td class="avg h1a">-</td>

<td><div class="container h2t"></div></td>
<td><div class="container h2k"></div></td>
<td><div class="container h2m"></div></td>
<td class="avg h2a">-</td>

<td class="end">-</td>
`;

body.appendChild(tr);

});

// Input erstellen
function addInput(container){

const i = document.createElement("input");
i.type = "number";
i.min = 1;
i.max = 6;
i.step = 0.25;

i.addEventListener("input", updateAll);

container.appendChild(i);

if(isAdmin && i.value !== ""){
addInput(container);
}

}

// Container initialisieren
document.querySelectorAll(".container").forEach(c=>{
addInput(c);
});

// Durchschnitt
function avg(container){

const values = [...container.querySelectorAll("input")]
.map(i => parseFloat(i.value))
.filter(v => !isNaN(v));

if(values.length === 0) return null;

return values.reduce((a,b)=>a+b,0)/values.length;
}

// Halbjahr
function calcHalf(row, prefix, w){

const t = avg(row.querySelector("." + prefix + "t"));
const k = avg(row.querySelector("." + prefix + "k"));
const m = avg(row.querySelector("." + prefix + "m"));

let sum = 0;
let ws = 0;

if(t!==null){sum+=t*w.t; ws+=w.t;}
if(k!==null){sum+=k*w.k; ws+=w.k;}
if(m!==null){sum+=m*w.m; ws+=w.m;}

return ws ? sum/ws : null;
}

// alles berechnen
function updateAll(){

document.querySelectorAll("tbody tr").forEach(row=>{

const name = row.querySelector(".subject").innerText;
const w = weights(name);

const h1 = calcHalf(row,"h1",w);
const h2 = calcHalf(row,"h2",w);

row.querySelector(".h1a").innerText = h1 ? h1.toFixed(2) : "-";
row.querySelector(".h2a").innerText = h2 ? h2.toFixed(2) : "-";

let end = null;

if(h1!==null && h2!==null) end = (h1+h2)/2;
else end = h1 || h2;

row.querySelector(".end").innerText = end ? end.toFixed(2) : "-";

});

}

updateAll();

</script>

</body>
</html>
