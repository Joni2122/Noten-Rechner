<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten Dashboard</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0f172a,#020617);
    color:white;
}

/* HEADER */
header{
    padding:20px;
    text-align:center;
    background:#111827;
    font-size:22px;
    font-weight:bold;
}

/* CONTAINER */
.container{
    padding:15px;
    max-width:1200px;
    margin:auto;
}

/* CARD STYLE */
.card{
    background:#111827;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

.subject-title{
    font-size:18px;
    margin-bottom:10px;
    color:#60a5fa;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    overflow-x:auto;
}

th,td{
    border:1px solid #374151;
    padding:6px;
    text-align:center;
}

input{
    width:60px;
    padding:5px;
    border-radius:6px;
    border:none;
    text-align:center;
}

/* AVG */
.avg{
    font-weight:bold;
    color:#34d399;
}

/* RESPONSIVE */
@media (max-width:700px){
    input{width:45px;}
}
</style>
</head>

<body>

<header>📊 Noten Dashboard</header>

<div class="container" id="app"></div>

<script>

////////////////////////////////////////////////////
// 🔥 FIREBASE CONFIG (HIER EINSETZEN)
////////////////////////////////////////////////////
const firebaseConfig = {
  apiKey: "AIzaSyAdC2nb71oeF9XtasVpUnmJot0ZqaODSaQ",
  authDomain: "noten-fc7d8.firebaseapp.com",
  databaseURL: "https://noten-fc7d8-default-rtdb.firebaseio.com",
  projectId: "noten-fc7d8",
  storageBucket: "noten-fc7d8.firebasestorage.app",
  messagingSenderId: "429440294646",
  appId: "1:429440294646:web:1db4b5690f10ea722b56d7",
  measurementId: "G-DDL10H1QWY"
};
  

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

////////////////////////////////////////////////////

// FÄCHER + GEWICHTUNG
const subjects = [
{name:"Mathe", type:"60/40"},
{name:"Deutsch", type:"60/40"},
{name:"Englisch", type:"60/40"},
{name:"Bio", type:"50/50"},
{name:"Geo", type:"50/50"},
{name:"Musik", type:"50/50"},
{name:"Religion", type:"50/50"},
{name:"Sport", type:"60/40"}
];

const app = document.getElementById("app");

// UI bauen
subjects.forEach((s,i)=>{

const card = document.createElement("div");
card.className="card";

card.innerHTML = `
<div class="subject-title">${s.name} (${s.type})</div>

<table>
<tr>
<th>T1</th><th>T2</th><th>T3</th>
<th>KA1</th><th>KA2</th>
<th>M</th>
<th>Ø</th>
</tr>

<tr>
<td><input id="t1_${i}" type="number"></td>
<td><input id="t2_${i}" type="number"></td>
<td><input id="t3_${i}" type="number"></td>
<td><input id="k1_${i}" type="number"></td>
<td><input id="k2_${i}" type="number"></td>
<td><input id="m_${i}" type="number"></td>
<td class="avg" id="avg_${i}">-</td>
</tr>
</table>
`;

app.appendChild(card);

});

// 🔥 BERECHNUNG
function calc(i){

let t1 = +document.getElementById("t1_"+i).value || 0;
let t2 = +document.getElementById("t2_"+i).value || 0;
let t3 = +document.getElementById("t3_"+i).value || 0;

let k1 = +document.getElementById("k1_"+i).value || 0;
let k2 = +document.getElementById("k2_"+i).value || 0;

let m = +document.getElementById("m_"+i).value || 0;

// Tests (4 Tests = 1 KA)
let testAvg = (t1+t2+t3)/3;

// KA
let kaAvg = (k1+k2)/2;

// Gewichtung simpel stabil
let result = (testAvg/4 + kaAvg + m)/3;

document.getElementById("avg_"+i).innerText = result.toFixed(2);

return result;
}

// 💾 SPEICHERN
function save(){

let data = {};

subjects.forEach((s,i)=>{

data[s.name] = {
t1:document.getElementById("t1_"+i).value,
t2:document.getElementById("t2_"+i).value,
t3:document.getElementById("t3_"+i).value,
k1:document.getElementById("k1_"+i).value,
k2:document.getElementById("k2_"+i).value,
m:document.getElementById("m_"+i).value
};

});

db.collection("noten").doc("user").set(data);

}

// 📥 LADEN
async function load(){

const doc = await db.collection("noten").doc("user").get();

if(doc.exists){

let data = doc.data();

subjects.forEach((s,i)=>{

if(data[s.name]){

document.getElementById("t1_"+i).value = data[s.name].t1;
document.getElementById("t2_"+i).value = data[s.name].t2;
document.getElementById("t3_"+i).value = data[s.name].t3;
document.getElementById("k1_"+i).value = data[s.name].k1;
document.getElementById("k2_"+i).value = data[s.name].k2;
document.getElementById("m_"+i).value = data[s.name].m;

calc(i);

}

});

}

}

// AUTO UPDATE
document.addEventListener("input", ()=>{
subjects.forEach((_,i)=>calc(i));
save();
});

load();

</script>

</body>
</html>
