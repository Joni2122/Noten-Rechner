<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Noten System</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
  color:#38bdf8;
}

table{
  width:100%;
  border-collapse:collapse;
  background:rgba(30,41,59,0.9);
  border-radius:12px;
  overflow:hidden;
}

th,td{
  border:1px solid #334155;
  padding:6px;
  text-align:center;
}

th{
  background:#0ea5e9;
}

input{
  width:55px;
  background:#0f172a;
  color:white;
  border:1px solid #334155;
  border-radius:6px;
  text-align:center;
}

.subject{
  font-weight:bold;
  background:#111827;
}

.avg{
  font-weight:bold;
  color:#38bdf8;
}
</style>
</head>

<body>

<h1>📚 Noten System</h1>

<table>
<thead>
<tr>
  <th>Fach</th>

  <th>KA1</th>
  <th>KA2</th>
  <th>KA3</th>
  <th>T1</th>
  <th>T2</th>
  <th>Mündlich</th>
  <th>Ø HJ1</th>

  <th>KA1</th>
  <th>KA2</th>
  <th>KA3</th>
  <th>T1</th>
  <th>T2</th>
  <th>Mündlich</th>
  <th>Ø HJ2</th>

  <th>Gesamt</th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://qrtnqwfcarwvxfljkqon.supabase.co",
  "sb_publishable_j7O7k3fTxwF5_LzTUjrt4w_dzW1ruuv"
);

const subjects = [
  "Mathe","Deutsch","Englisch","Französisch","NWT",
  "Geo","Bio","Chemie","Physik","Geschichte",
  "GK","Musik","Kunst","Reli","Sport"
];

let data = [];

// 📥 LOAD
async function load(){
  const { data: res } = await supabase.from("grades").select("*");
  data = res || [];
  render();
}

load();

// 🔍 GET
function get(subject, semester){
  return data.find(d => d.subject === subject && d.semester === semester);
}

// 🧮 BERECHNUNG
function calc(e){

  if(!e) return "-";

  let exams = [e.exam1,e.exam2,e.exam3].filter(v=>v!=null);
  let tests = [e.test1,e.test2].filter(v=>v!=null);

  let examAvg = exams.length ? exams.reduce((a,b)=>a+b)/exams.length : null;
  let testAvg = tests.length ? tests.reduce((a,b)=>a+b)/tests.length : null;

  let sum = 0;
  let w = 0;

  if(examAvg!==null){sum+=examAvg*0.6; w+=0.6;}
  if(testAvg!==null){sum+=testAvg*0.6; w+=0.6;}
  if(e.oral!=null){sum+=e.oral*0.4; w+=0.4;}

  return w ? (sum/w).toFixed(2) : "-";
}

// 💾 SAVE
async function save(subject, semester, field, value){

  let entry = data.find(d => d.subject === subject && d.semester === semester);

  if(!entry){
    entry = { subject, semester };
    data.push(entry);
  }

  entry[field] = value === "" ? null : parseFloat(value);

  await supabase.from("grades").upsert(entry);
}

// 📊 RENDER
function render(){

  const body = document.getElementById("body");
  body.innerHTML = "";

  subjects.forEach(sub => {

    const h1 = get(sub,1) || {};
    const h2 = get(sub,2) || {};

    body.innerHTML += `
      <tr>
        <td class="subject">${sub}</td>

        ${cell(sub,1,"exam1",h1.exam1)}
        ${cell(sub,1,"exam2",h1.exam2)}
        ${cell(sub,1,"exam3",h1.exam3)}
        ${cell(sub,1,"test1",h1.test1)}
        ${cell(sub,1,"test2",h1.test2)}
        ${cell(sub,1,"oral",h1.oral)}

        <td class="avg">${calc(h1)}</td>

        ${cell(sub,2,"exam1",h2.exam1)}
        ${cell(sub,2,"exam2",h2.exam2)}
        ${cell(sub,2,"exam3",h2.exam3)}
        ${cell(sub,2,"test1",h2.test1)}
        ${cell(sub,2,"test2",h2.test2)}
        ${cell(sub,2,"oral",h2.oral)}

        <td class="avg">${calc(h2)}</td>

        <td class="avg">${avg(calc(h1),calc(h2))}</td>
      </tr>
    `;
  });
}

// 🧩 CELL INPUT
function cell(subject, semester, field, value){

  return `
    <td>
      <input value="${value ?? ""}"
        onchange="update('${subject}',${semester},'${field}',this.value)">
    </td>
  `;
}

// 📊 TOTAL
function avg(a,b){
  let arr = [parseFloat(a), parseFloat(b)].filter(x=>!isNaN(x));
  if(!arr.length) return "-";
  return (arr.reduce((x,y)=>x+y)/arr.length).toFixed(2);
}

// 🌐 GLOBAL UPDATE
window.update = async function(subject, semester, field, value){
  await save(subject, semester, field, value);
};

</script>

</body>
</html>
