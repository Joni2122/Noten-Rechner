<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten Rechner</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    margin:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    border:1px solid #333;
    padding:8px;
    text-align:center;
}

input{
    width:60px;
}
</style>
</head>

<body>

<h1>📊 Noten Rechner</h1>

<table>
<tbody id="body"></tbody>
</table>

<script>

////////////////////////////////////////////////////
// 🔥 HIER MUSST DU DEINEN FIREBASE BLOCK EINFÜGEN
////////////////////////////////////////////////////

const firebaseConfig = {// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAdC2nb71oeF9XtasVpUnmJot0ZqaODSaQ",
  authDomain: "noten-fc7d8.firebaseapp.com",
  databaseURL: "https://noten-fc7d8-default-rtdb.firebaseio.com",
  projectId: "noten-fc7d8",
  storageBucket: "noten-fc7d8.firebasestorage.app",
  messagingSenderId: "429440294646",
  appId: "1:429440294646:web:1db4b5690f10ea722b56d7",
  measurementId: "G-DDL10H1QWY"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
  
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

////////////////////////////////////////////////////

const subjects = [
"Mathe",
"Deutsch",
"Englisch",
"Bio",
"Geo",
"Musik"
];

const body = document.getElementById("body");

// Tabelle bauen
subjects.forEach((s,i)=>{
const row = document.createElement("tr");

row.innerHTML = `
<td>${s}</td>
<td><input type="number" id="n${i}" min="1" max="6"></td>
`;

body.appendChild(row);
});

// speichern
function save(){
let data = {};

subjects.forEach((s,i)=>{
data[s] = document.getElementById("n"+i).value;
});

db.collection("noten").doc("user").set(data);
}

// laden
async function load(){
const doc = await db.collection("noten").doc("user").get();

if(doc.exists){
const data = doc.data();

subjects.forEach((s,i)=>{
if(data[s]){
document.getElementById("n"+i).value = data[s];
}
});
}
}

// auto save
document.addEventListener("input", save);

load();

</script>

</body>
</html>
