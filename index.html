<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Noten Cloud</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

.container{
  max-width:900px;
  margin:auto;
}

.admin{
  display:none;
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}

input,select,button{
  padding:8px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button{
  background:#38bdf8;
  cursor:pointer;
}
button:hover{background:#0ea5e9;}

table{
  width:100%;
  border-collapse: collapse;
  background:#1e293b;
}

th,td{
  border:1px solid #334155;
  padding:10px;
  text-align:center;
}

th{
  background:#0ea5e9;
}
</style>
</head>

<body>

<h1>📚 Noten Cloud App</h1>

<div class="container">

<!-- 🔐 ADMIN -->
<div id="adminPanel" class="admin">
  <h3>Admin Mode</h3>

  <input id="subject" placeholder="Fach">

  <select id="semester">
    <option value="1">Halbjahr 1</option>
    <option value="2">Halbjahr 2</option>
  </select>

  <select id="type">
    <option value="test">Test</option>
    <option value="exam">Klassenarbeit</option>
    <option value="oral">Mündlich</option>
  </select>

  <input id="grade" type="number" step="0.1" placeholder="Note">

  <button onclick="addGrade()">Hinzufügen</button>
</div>

<table>
<thead>
<tr>
  <th>Fach</th>
  <th>HJ1</th>
  <th>HJ2</th>
  <th>Ø</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// 🔥 SUPABASE VERBINDUNG
const supabase = createClient(
  "https://qrtnqwfcarwvxfljkqon.supabase.co",
  "sb_publishable_j7O7k3fTxwF5_LzTUjrt4w_dzW1ruuv"
);

// 🔐 ADMIN (?admin=1)
const isAdmin = new URLSearchParams(location.search).get("admin") === "1";
if(isAdmin) document.getElementById("adminPanel").style.display = "block";

// 📦 DATEN
let data = [];

// 📥 LOAD
async function load(){
  const { data: result, error } = await supabase
    .from("grades")
    .select("*");

  if(error){
    console.log("LOAD ERROR:", error);
    return;
  }

  data = result || [];
  render();
}

load();

// ➕ ADD NOTE
window.addGrade = async function(){

  if(!isAdmin) return;

  const subject = document.getElementById("subject").value;
  const semester = parseInt(document.getElementById("semester").value);
  const type = document.getElementById("type").value;
  const grade = parseFloat(document.getElementById("grade").value);

  if(!subject || isNaN(grade)) return;

  const { error } = await supabase
    .from("grades")
    .insert({
      subject,
      semester,
      type,
      grade
    });

  if(error){
    console.log("INSERT ERROR:", error);
  }

  load();
};

// 📊 BERECHNUNG
function calc(list, subject){

  const is50 = ["Geo","Bio","Reli","Gemeinschaftskunde","Musik"].includes(subject);

  let sum = 0;
  let w = 0;

  list.forEach(n => {

    let weight;

    if(n.type === "oral"){
      weight = is50 ? 0.5 : 0.4;
    } else {
      weight = is50 ? 0.5 : 0.6;
    }

    sum += n.grade * weight;
    w += weight;
  });

  return w ? (sum / w).toFixed(2) : "-";
}

// 📊 RENDER
function render(){

  const body = document.getElementById("body");
  body.innerHTML = "";

  const subjects = [...new Set(data.map(d => d.subject))];

  subjects.forEach(sub => {

    const h1 = data.filter(d => d.subject === sub && d.semester === 1);
    const h2 = data.filter(d => d.subject === sub && d.semester === 2);

    const avg1 = calc(h1, sub);
    const avg2 = calc(h2, sub);

    const both = [parseFloat(avg1), parseFloat(avg2)].filter(x => !isNaN(x));
    const total = both.length ? (both.reduce((a,b)=>a+b,0)/both.length).toFixed(2) : "-";

    body.innerHTML += `
      <tr>
        <td>${sub}</td>
        <td>${avg1}</td>
        <td>${avg2}</td>
        <td><b>${total}</b></td>
      </tr>
    `;
  });
}

</script>

</body>
</html>
