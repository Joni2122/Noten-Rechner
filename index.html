<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Noten Tabelle</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

table{
  width:100%;
  border-collapse: collapse;
  margin-top:20px;
  background:#1e293b;
}

th,td{
  border:1px solid #334155;
  padding:10px;
  text-align:center;
}

th{
  background:#0ea5e9;
}

input,select,button{
  padding:8px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button{
  background:#38bdf8;
  cursor:pointer;
}
button:hover{background:#0ea5e9;}

.admin{
  display:none;
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
</style>
</head>

<body>

<h1>📚 Noten Tabelle</h1>

<div id="adminPanel" class="admin">
  <h3>🔐 Admin</h3>

  <input id="subject" placeholder="Fach">

  <select id="semester">
    <option value="1">HJ1</option>
    <option value="2">HJ2</option>
  </select>

  <select id="type">
    <option value="test">Test</option>
    <option value="exam">Klassenarbeit</option>
    <option value="oral">Mündlich</option>
  </select>

  <input id="grade" type="number" step="0.1" placeholder="Note">

  <button onclick="add()">Hinzufügen</button>
</div>

<table>
  <thead>
    <tr>
      <th>Fach</th>
      <th>HJ1</th>
      <th>HJ2</th>
      <th>Ø Fach</th>
    </tr>
  </thead>
  <tbody id="body"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 🔥 Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAdC2nb71oeF9XtasVpUnmJot0ZqaODSaQ",
  authDomain: "noten-fc7d8.firebaseapp.com",
  databaseURL: "https://noten-fc7d8-default-rtdb.firebaseio.com",
  projectId: "noten-fc7d8",
  storageBucket: "noten-fc7d8.firebasestorage.app",
  messagingSenderId: "429440294646",
  appId: "1:429440294646:web:1db4b5690f10ea722b56d7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 🔐 Admin Mode
const isAdmin = new URLSearchParams(location.search).get("admin") === "1";
if(isAdmin) document.getElementById("adminPanel").style.display = "block";

// 📦 Daten
let data = {};

// 📥 Load
onValue(ref(db,"grades"), snap=>{
  data = snap.val() || {};
  render();
});

// ➕ Add Note
window.add = function(){
  if(!isAdmin) return;

  const subject = document.getElementById("subject").value;
  const semester = document.getElementById("semester").value;
  const type = document.getElementById("type").value;
  const grade = parseFloat(document.getElementById("grade").value);

  if(!subject || isNaN(grade)) return;

  if(!data[subject]){
    data[subject] = {1:[],2:[]};
  }

  data[subject][semester].push({type,grade});

  set(ref(db,"grades"), data);
};

// 📊 Gewichtung
function calc(list, subject){

  if(!list.length) return null;

  const is50 = ["Geo","Bio","Reli","Gemeinschaftskunde","Musik"].includes(subject);

  let sum=0;
  let w=0;

  list.forEach(n=>{
    let weight;

    if(n.type==="oral"){
      weight = is50 ? 0.5 : 0.4;
    }else{
      weight = is50 ? 0.5 : 0.6;
    }

    sum += n.grade * weight;
    w += weight;
  });

  return w ? (sum/w) : null;
}

// 📊 Render Tabelle
function render(){

  const body = document.getElementById("body");
  body.innerHTML="";

  Object.keys(data).forEach(sub=>{

    const hj1 = calc(data[sub][1]||[],sub);
    const hj2 = calc(data[sub][2]||[],sub);

    let arr = [hj1,hj2].filter(x=>x!==null);
    let avg = arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(2) : "-";

    body.innerHTML += `
      <tr>
        <td>${sub}</td>
        <td>${hj1 ?? "-"}</td>
        <td>${hj2 ?? "-"}</td>
        <td><b>${avg}</b></td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
