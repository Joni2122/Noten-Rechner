<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten System</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    margin:10px;
}

h1{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:30px;
}

th,td{
    border:1px solid #333;
    padding:6px;
    text-align:center;
}

input{
    width:45px;
    text-align:center;
    background:#1a1a1a;
    color:white;
    border:1px solid #444;
}

.section{
    margin-top:20px;
    font-weight:bold;
    color:#4dd0ff;
}
</style>
</head>

<body>

<h1>📊 Noten System</h1>

<div id="container"></div>

<script>

////////////////////////////////////////////////////
// 🔥 FIREBASE CONFIG HIER EINSETZEN
////////////////////////////////////////////////////
const firebaseConfig = {
  // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAdC2nb71oeF9XtasVpUnmJot0ZqaODSaQ",
  authDomain: "noten-fc7d8.firebaseapp.com",
  databaseURL: "https://noten-fc7d8-default-rtdb.firebaseio.com",
  projectId: "noten-fc7d8",
  storageBucket: "noten-fc7d8.firebasestorage.app",
  messagingSenderId: "429440294646",
  appId: "1:429440294646:web:1db4b5690f10ea722b56d7",
  measurementId: "G-DDL10H1QWY"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

////////////////////////////////////////////////////

const faecher = [
{
name:"Mathe",
type:"60/40"
},
{
name:"Deutsch",
type:"60/40"
},
{
name:"Englisch",
type:"60/40"
},
{
name:"Bio",
type:"50/50"
},
{
name:"Geo",
type:"50/50"
},
{
name:"Musik",
type:"50/50"
},
{
name:"Sport",
type:"60/40"
}
];

const container = document.getElementById("container");

// Tabellen bauen
faecher.forEach((fach,i)=>{

const div = document.createElement("div");

div.innerHTML = `
<div class="section">${fach.name} (${fach.type})</div>

<table>
<tr>
<th>Test 1</th>
<th>Test 2</th>
<th>Test 3</th>
<th>KA 1</th>
<th>KA 2</th>
<th>Mündlich</th>
<th>Ø</th>
</tr>

<tr>
<td><input id="t1_${i}" type="number"></td>
<td><input id="t2_${i}" type="number"></td>
<td><input id="t3_${i}" type="number"></td>
<td><input id="k1_${i}" type="number"></td>
<td><input id="k2_${i}" type="number"></td>
<td><input id="m_${i}" type="number"></td>
<td id="avg_${i}">-</td>
</tr>
</table>
`;

container.appendChild(div);

});

// Berechnung
function calc(i){

let t1 = parseFloat(document.getElementById("t1_"+i).value)||0;
let t2 = parseFloat(document.getElementById("t2_"+i).value)||0;
let t3 = parseFloat(document.getElementById("t3_"+i).value)||0;

let k1 = parseFloat(document.getElementById("k1_"+i).value)||0;
let k2 = parseFloat(document.getElementById("k2_"+i).value)||0;

let m = parseFloat(document.getElementById("m_"+i).value)||0;

// Tests: 4 Tests = 1 KA
let testAvg = (t1+t2+t3)/3;

// KA Schnitt
let kaAvg = (k1+k2)/2;

// alles zusammen
let weightedTests = testAvg / 4;

let result = (weightedTests + kaAvg + m)/3;

document.getElementById("avg_"+i).innerText = result.toFixed(2);

return result;
}

// speichern
function save(){

let data = {};

faecher.forEach((f,i)=>{

data[f.name] = {
t1: document.getElementById("t1_"+i).value,
t2: document.getElementById("t2_"+i).value,
t3: document.getElementById("t3_"+i).value,
k1: document.getElementById("k1_"+i).value,
k2: document.getElementById("k2_"+i).value,
m: document.getElementById("m_"+i).value
};

});

db.collection("noten").doc("user1").set(data);

}

// laden
async function load(){

const doc = await db.collection("noten").doc("user1").get();

if(doc.exists){
const data = doc.data();

faecher.forEach((f,i)=>{

if(data[f.name]){

document.getElementById("t1_"+i).value = data[f.name].t1;
document.getElementById("t2_"+i).value = data[f.name].t2;
document.getElementById("t3_"+i).value = data[f.name].t3;
document.getElementById("k1_"+i).value = data[f.name].k1;
document.getElementById("k2_"+i).value = data[f.name].k2;
document.getElementById("m_"+i).value = data[f.name].m;

calc(i);
}

});

}

}

// input events
document.addEventListener("input", ()=>{

faecher.forEach((_,i)=>{
calc(i);
});

save();

});

load();

</script>

</body>
</html>
