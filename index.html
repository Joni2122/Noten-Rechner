<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noten System</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
    margin:0;
    font-family: Arial;
    background: #0a0f1c;
    color:white;
}

/* TOP BAR */
.topbar{
    background: linear-gradient(90deg,#1e293b,#0f172a);
    padding:15px;
    font-size:20px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
}

/* BADGE */
.badge{
    color:#4ade80;
}

/* LAYOUT */
.container{
    padding:15px;
}

/* CARD */
.card{
    background:#111827;
    margin:15px 0;
    padding:15px;
    border-radius:12px;
    border:1px solid #1f2937;
}

/* TITLE */
.title{
    font-size:18px;
    margin-bottom:10px;
    color:#60a5fa;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #374151;
    padding:6px;
    text-align:center;
}

input{
    width:55px;
    padding:4px;
    background:#0f172a;
    border:1px solid #334155;
    color:white;
    text-align:center;
}

.avg{
    color:#34d399;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="topbar">
📊 Noten System
<div id="mode"></div>
</div>

<div class="container" id="app"></div>

<script>

////////////////////////////////////////////////////
// FIREBASE
////////////////////////////////////////////////////
const firebaseConfig = {
  apiKey: "AIzaSyAdC2nb71oeF9XtasVpUnmJot0ZqaODSaQ",
  authDomain: "noten-fc7d8.firebaseapp.com",
  databaseURL: "https://noten-fc7d8-default-rtdb.firebaseio.com",
  projectId: "noten-fc7d8",
  storageBucket: "noten-fc7d8.firebasestorage.app",
  messagingSenderId: "429440294646",
  appId: "1:429440294646:web:1db4b5690f10ea722b56d7",
  measurementId: "G-DDL10H1QWY"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

////////////////////////////////////////////////////

// ADMIN MODE
const isAdmin = new URLSearchParams(window.location.search).has("admin");

document.getElementById("mode").innerText = isAdmin ? "ADMIN" : "VIEW";

// Fächer
const subjects = ["Mathe","Deutsch","Englisch","Bio","Geo","Musik","Religion","Sport"];

const app = document.getElementById("app");

// Daten speichern lokal im Speicher
let cache = {};

// UI bauen
subjects.forEach((s,i)=>{

const card = document.createElement("div");
card.className="card";

card.innerHTML = `
<div class="title">${s}</div>

<table>
<tr>
<th>T1</th><th>T2</th><th>T3</th>
<th>KA1</th><th>KA2</th>
<th>M</th>
<th>Ø</th>
</tr>

<tr>
<td><input id="t1_${i}"></td>
<td><input id="t2_${i}"></td>
<td><input id="t3_${i}"></td>
<td><input id="k1_${i}"></td>
<td><input id="k2_${i}"></td>
<td><input id="m_${i}"></td>
<td class="avg" id="avg_${i}">-</td>
</tr>
</table>
`;

app.appendChild(card);

});

// CALC
function calc(i){

let t1=+document.getElementById("t1_"+i).value||0;
let t2=+document.getElementById("t2_"+i).value||0;
let t3=+document.getElementById("t3_"+i).value||0;

let k1=+document.getElementById("k1_"+i).value||0;
let k2=+document.getElementById("k2_"+i).value||0;

let m=+document.getElementById("m_"+i).value||0;

let test=(t1+t2+t3)/3;
let ka=(k1+k2)/2;

let result=(test/4 + ka + m)/3;

document.getElementById("avg_"+i).innerText=result.toFixed(2);

return result;
}

// SAVE
function save(){

let data={};

subjects.forEach((s,i)=>{

data[s]={
t1:t1v(i),t2:t2v(i),t3:t3v(i),
k1:k1v(i),k2:k2v(i),
m:mv(i)
};

});

db.collection("noten").doc("user").set(data);
}

// helpers
const t1v=i=>document.getElementById("t1_"+i).value;
const t2v=i=>document.getElementById("t2_"+i).value;
const t3v=i=>document.getElementById("t3_"+i).value;
const k1v=i=>document.getElementById("k1_"+i).value;
const k2v=i=>document.getElementById("k2_"+i).value;
const mv=i=>document.getElementById("m_"+i).value;

// 🔥 REALTIME FIX (WICHTIGSTE VERBESSERUNG)
db.collection("noten").doc("user")
.onSnapshot(doc=>{

if(!doc.exists) return;

let data=doc.data();

subjects.forEach((s,i)=>{

if(!data[s]) return;

document.getElementById("t1_"+i).value=data[s].t1||"";
document.getElementById("t2_"+i).value=data[s].t2||"";
document.getElementById("t3_"+i).value=data[s].t3||"";
document.getElementById("k1_"+i).value=data[s].k1||"";
document.getElementById("k2_"+i).value=data[s].k2||"";
document.getElementById("m_"+i).value=data[s].m||"";

calc(i);

});

});

// INPUT LOCK + SAVE
document.addEventListener("input",()=>{

subjects.forEach((_,i)=>calc(i));
save();

});

// ADMIN LOCK FIX
if(!isAdmin){
document.addEventListener("click",(e)=>{
if(e.target.tagName==="INPUT"){
e.target.readOnly=true;
}
});
}

</script>

</body>
</html>
